name: Publish Docker images

on:
    push:
        branches:
            - '**'
        tags-ignore:
            - '**'
    schedule:
        - cron: '0 0 * * 0'
    workflow_dispatch:

jobs:
    build-and-publish-images:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        env:
            REGISTRY: docker.io
            IMAGE_PREFIX: dontdrinkandroot/php

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Resolve branch name
              id: vars
              shell: bash
              run: |
                  BRANCH_NAME="${GITHUB_REF_NAME}"
                  SAFE_BRANCH="$(echo "${BRANCH_NAME}" \
                    | tr '[:upper:]' '[:lower:]' \
                    | sed 's#[/]#-#g' \
                    | sed 's/[^a-z0-9._-]/-/g' \
                    | sed 's/-\{2,\}/-/g' \
                    | sed 's/^-//; s/-$//')"
                  
                  if [ -z "${SAFE_BRANCH}" ]; then
                    echo "Failed to derive a safe Docker tag from branch '${BRANCH_NAME}'" >&2
                    exit 1
                  fi
                  
                  echo "branch_name=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
                  echo "safe_branch=${SAFE_BRANCH}" >> "${GITHUB_OUTPUT}"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push build image
              uses: docker/build-push-action@v6
              with:
                  context: ./build
                  file: ./build/Dockerfile
                  push: true
                  tags: ${{ env.IMAGE_PREFIX }}:build-${{ steps.vars.outputs.safe_branch }}
                  cache-from: type=gha,scope=build-image
                  cache-to: type=gha,mode=max,scope=build-image

            - name: Build and push symfony-base image
              uses: docker/build-push-action@v6
              with:
                  context: ./symfony
                  file: ./symfony/base.Dockerfile
                  push: true
                  tags: ${{ env.IMAGE_PREFIX }}:symfony-base-${{ steps.vars.outputs.safe_branch }}
                  cache-from: type=gha,scope=symfony-base-image
                  cache-to: type=gha,mode=max,scope=symfony-base-image

            - name: Build and push symfony-dev image
              uses: docker/build-push-action@v6
              with:
                  context: ./symfony
                  file: ./symfony/dev.Dockerfile
                  push: true
                  tags: ${{ env.IMAGE_PREFIX }}:symfony-dev-${{ steps.vars.outputs.safe_branch }}
                  build-args: |
                      FROM=${{ env.IMAGE_PREFIX }}:symfony-base-${{ steps.vars.outputs.safe_branch }}
                  cache-from: type=gha,scope=symfony-dev-image
                  cache-to: type=gha,mode=max,scope=symfony-dev-image

            - name: Build and push symfony-prod image
              uses: docker/build-push-action@v6
              with:
                  context: ./symfony
                  file: ./symfony/prod.Dockerfile
                  push: true
                  tags: ${{ env.IMAGE_PREFIX }}:symfony-prod-${{ steps.vars.outputs.safe_branch }}
                  build-args: |
                      FROM=${{ env.IMAGE_PREFIX }}:symfony-base-${{ steps.vars.outputs.safe_branch }}
                  cache-from: type=gha,scope=symfony-prod-image
                  cache-to: type=gha,mode=max,scope=symfony-prod-image
